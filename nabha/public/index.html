<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Nabha Digital Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Noto+Sans+Gurmukhi&display=swap" rel=stylesheet>
<style>
:root{--bg:#f2f7f5;--c:#fff;--t:#12302a;--p:#13a085;--p2:#0b6e5b;--b:#dce9e4;--sh:0 8px 28px #0b3d3318}
body.dark{--bg:#0b1613;--c:#14251f;--t:#e8f3ef;--b:#27413a;--sh:0 8px 28px #0006}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 'Noto Sans Gurmukhi','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;background:linear-gradient(90deg,var(--p2),var(--p));color:#fff;box-shadow:var(--sh);z-index:5}
header.land{position:absolute;left:0;right:0;background:none;box-shadow:none}.logo{font-size:1.05rem}.sp{flex:1}
button{font:inherit;padding:10px 16px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);cursor:pointer;min-height:44px;transition:.2s}button:hover{transform:translateY(-2px)}
header button{background:#ffffff26;color:#fff;border-color:#ffffff40;padding:6px 12px;min-height:36px;backdrop-filter:blur(6px)}.lg.on{background:#fff!important;color:var(--p2)!important;font-weight:700}
.pri{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0;margin:8px 8px 8px 0;box-shadow:0 6px 16px #13a08560}
.dot{font-size:.8rem;padding:4px 10px;border-radius:20px;background:#ffffff26}.dot.off{color:#ffd27a}
main{flex:1;max-width:860px;width:100%;margin:0 auto;padding:20px 16px}footer{text-align:center;padding:16px;background:var(--c);border-top:1px solid var(--b);font-size:.9rem}
.hero{position:relative;overflow:hidden;min-height:92vh;display:flex;align-items:center;padding:90px 20px 50px;background:linear-gradient(135deg,#072e27,#0f7a63 50%,#2a55c0);color:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;animation:fl 9s ease-in-out infinite alternate}.b1{width:340px;height:340px;background:#ffb703;top:-80px;right:-60px}.b2{width:300px;height:300px;background:#2de0b5;bottom:-90px;left:-70px;animation-delay:-4s}
@keyframes fl{to{transform:translate(30px,40px) scale(1.15)}}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero-in{position:relative;max-width:1080px;margin:auto;display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:center;width:100%}
.hl{animation:up .8s both}.hero h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.2;margin:14px 0}.sub{font-size:1.1rem;opacity:.92;max-width:520px}
.pill,.chips span{display:inline-block;padding:7px 15px;border-radius:30px;background:#ffffff26;border:1px solid #ffffff40;font-size:.92rem}.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.glass{background:var(--c);color:var(--t);border-radius:26px;padding:24px;box-shadow:0 30px 70px #0006;animation:up .8s .15s both}.glass h2{margin:16px 0 4px}
.feats{max-width:1080px;margin:0 auto;padding:50px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.fc{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:22px;box-shadow:var(--sh);transition:.25s}.fc:hover{transform:translateY(-6px)}.fc h3{margin:8px 0 4px}.fc p{margin:0;opacity:.8}
.fc i{font-style:normal;font-size:2rem;display:grid;place-items:center;width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#d9f5ec,#fff0c2)}
.banner{background:linear-gradient(120deg,var(--p2),var(--p) 55%,#3b6fe0);color:#fff;border-radius:22px;padding:20px 24px;margin-bottom:12px;box-shadow:var(--sh)}.banner h2{margin:0}
.card,.item,.stat{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.item{display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}.item:hover{transform:translateX(5px);border-color:var(--p)}
.ic{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#d9f5ec,#ffeeba);font-size:1.3rem;flex:none}.gr{flex:1}.ck{font-size:1.3rem}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.stat{flex:1;min-width:110px;text-align:center}.stat b{display:block;font-size:1.8rem;background:linear-gradient(135deg,var(--p),#3b6fe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:6px;background:var(--bg);padding:6px;border-radius:16px}.tabs button{flex:1;border:0;background:none;font-size:.95rem;padding:8px 4px}.tabs .on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 14px #13a08550}
input,select{width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;border:1px solid var(--b);background:var(--bg);color:var(--t);font:inherit}input:focus{outline:2px solid var(--p)}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--p) calc(var(--v)*1%),var(--b) 0);display:grid;place-items:center}.ring span{background:var(--c);width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.4rem}
.hint{background:#fff3cd;color:#5c4400;padding:12px 16px;border-radius:14px;margin:10px 0}.err{color:#d64545}table{width:100%;border-collapse:collapse}td{padding:10px 8px;border-bottom:1px solid var(--b)}
.bar{background:var(--b);height:10px;border-radius:6px;min-width:70px}.bar i{display:block;height:10px;background:linear-gradient(90deg,var(--p),#3b6fe0);border-radius:6px}
.opt{display:block;padding:11px;margin:6px 0;border:1px solid var(--b);border-radius:12px}.opt input{width:auto}.good{background:#c8f0d8;color:#123}.bad{background:#f8c9c4;color:#321}
a{color:var(--p);cursor:pointer;text-decoration:underline}.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--p2);color:#fff;padding:10px 20px;border-radius:24px;box-shadow:var(--sh)}
@media(max-width:820px){.hero-in{grid-template-columns:1fr;gap:28px}.hero{padding-top:110px}}

const g=i=>document.getElementById(i),t=k=>D[S.lang][k]||D.en[k]||k,L=o=>o?(o[S.lang]||o.en||''):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,m,b){const r=await fetch(u,{method:m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.token},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j}

async function doAuth(){const b={username:g('un').value.trim(),password:g('pw').value,role:S.role};try{if(S.reg){b.name=g('nm').value.trim();if(g('cl'))b.class=+g('cl').value}const r=await api(S.reg?'/api/register':'/api/login','POST',b);if(r.pending){S.reg=false;S.msg='wait';return render()}S.token=r.token;S.user=r.user;localStorage.token=r.token;localStorage.user=JSON.stringify(r.user);S.msg='';S.reg=false;boot()}catch(e){S.msg=e.error||'wrong';render()}}

function annV(){return S.ann.length?S.ann.map(a=>`<div class=item>📢 ${esc(a.text)}<br><small>${esc(a.by)}</small></div>`).join(''):`<p>${t('noAnn')}</p>`}
function studV(){const c=S.c;if(S.cur&&S.cur.k=='lesson')return lessonV();if(S.cur&&S.cur.k=='quiz')return quizV();const P=pct();
return `<div class=banner><h2>👋 ${esc(S.user.name)}</h2><small>${t('cls')} ${S.user.class}</small></div><div class="row card"><div class=ring style="--v:${P}"><span>${P}%</span></div><div><b>${t('overall')}</b><p>${t('lessons')}: ${S.p.l.length}/${c.lessons.length}<br>${t('quizzes')}: ${Object.keys(S.p.q).length}/${c.quizzes.length}<br>🏅 ${t('badges')}: ${Math.floor(S.p.l.length/3)}</p></div></div>${P==0?`<div class=hint>${t('start')}</div>`:''}<h3>${t('lessons')}</h3>${c.lessons.map(l=>`<div class=item onclick="S.cur={k:'lesson',id:${l.id}};render()"><span class=ic>${{Maths:'➗',Science:'🔬',English:'🔤',Punjabi:'ਅ'}[l.s]||'📘'}</span><div class=gr><b>${esc(L(l.t))}</b><br><small>${t(l.s)} · ${t('cls')} ${l.c}</small></div><span class=ck>${S.p.l.includes(l.id)?'✅':'›'}</span></div>`).join('')}<h3>${t('ann')}</h3>${annV()}`}
function lessonV(){const l=S.c.lessons.find(x=>x.id==S.cur.id),q=S.c.quizzes.find(x=>x.lesson==l.id),d=S.p.l.includes(l.id);return `<button onclick="S.cur=null;render()">← ${t('back')}</button><h2>${esc(L(l.t))}</h2><h4>${t('note')}</h4><p>${esc(L(l.n))}</p>${d?`<p>✅ ${t('done')}</p>`:`<button class=pri onclick="act('l',${l.id});render()">${t('markDone')}</button>`}${q?`<button class=pri onclick="S.cur={k:'quiz',id:${q.id}};S.qa={};S.res=null;render()">📝 ${t('takeQuiz')}${S.p.q[q.id]!=null?' ('+t('score')+': '+S.p.q[q.id]+'%)':''}</button>`:''}`}
function quizV(){const q=S.c.quizzes.find(x=>x.id==S.cur.id);return `<button onclick="S.cur={k:'lesson',id:${q.lesson}};render()">← ${t('back')}</button><h2>📝 ${t('quizzes')}</h2>${q.q.map((x,i)=>`<div class=card><b>${i+1}. ${esc(L(x.q))}</b>${x.o.map((o,j)=>`<label class="opt ${S.res!=null?(j==x.a?'good':(S.qa[i]==j?'bad':'')):''}"><input type=radio name=q${i} ${S.res!=null?'disabled':''} onclick="S.qa[${i}]=${j}"> ${esc(typeof o=='string'?o:L(o))}</label>`).join('')}</div>`).join('')}${S.res!=null?`<h3>${t('score')}: ${S.res}%</h3>`:`<button class=pri onclick="subQ(${q.id})">${t('submit')}</button>`}`}
function subQ(id){const q=S.c.quizzes.find(x=>x.id==id);S.res=Math.round(q.q.filter((x,i)=>S.qa[i]===x.a).length/q.q.length*100);act('q',id,S.res);render()}
function act(ty,id,sc){if(ty=='l'){if(!S.p.l.includes(id))S.p.l.push(id)}else S.p.q[id]=sc;localStorage['p'+S.user.id]=JSON.stringify(S.p);const Q=JSON.parse(localStorage.q||'[]');Q.push({t:ty,id,score:sc,u:S.user.id});localStorage.q=JSON.stringify(Q);flush()}
async function flush(){const Q=JSON.parse(localStorage.q||'[]').filter(o=>o.u==S.user.id);if(!Q.length||!navigator.onLine)return false;try{await api('/api/sync','POST',{ops:Q});localStorage.q=JSON.stringify(JSON.parse(localStorage.q).filter(o=>o.u!=S.user.id));return true}catch{return false}}
async function doSync(){await flush();if(navigator.onLine)await boot();S.toast=t('synced');render();setTimeout(()=>{S.toast='';render()},1800)}
function teachV(){const a=S.stu.length?Math.round(S.stu.reduce((s,x)=>s+x.p,0)/S.stu.length):0;return `<div class=banner><h2>👩‍🏫 ${esc(S.user.name)}</h2></div><div class=row><div class=stat><b>${S.stu.length}</b>${t('students')}</div><div class=stat><b>${S.c.lessons.length}</b>${t('lessons')}</div><div class=stat><b>${a}%</b>${t('avg')}</div></div><h3>${t('students')}</h3>${S.stu.length?`<table>${S.stu.map(x=>`<tr><td>${esc(x.name)}</td><td>${t('cls')} ${x.class}</td><td><div class=bar><i style="width:${x.p}%"></i></div></td><td>${x.p}%</td></tr>`).join('')}</table>`:`<p>${t('noStu')}</p>`}<h3>${t('add')}</h3><div class=card>${['en','hi','pa'].map(l=>`<input id=t_${l} placeholder="${t('title')} (${l.toUpperCase()})">`).join('')}<select id=sb>${['Maths','Science','English','Punjabi'].map(s=>`<option value=${s}>${t(s)}</option>`).join('')}</select><input id=lc type=number value=8 min=6 max=12><button class=pri onclick="addL()">${t('add')}</button></div><h3>${t('ann')}</h3><div class=card><input id=an placeholder="${t('msg')}"><button class=pri onclick="postA()">${t('post')}</button></div>${annV()}`}
async function addL(){if(!g('t_en').value.trim())return;await api('/api/teacher/lesson','POST',{en:g('t_en').value,hi:g('t_hi').value,pa:g('t_pa').value,subject:g('sb').value,cls:g('lc').value});boot()}
async function postA(){await api('/api/announce','POST',{text:g('an').value});boot()}
function admV(){const u=S.users,n=r=>u.filter(x=>x.role==r).length;return `<div class=banner><h2>🛠️ ${t('admin')}</h2></div><div class=row><div class=stat><b>${n('student')}</b>${t('student')}</div><div class=stat><b>${n('teacher')}</b>${t('teacher')}</div><div class=stat><b>${u.filter(x=>!x.approved).length}</b>${t('pending')}</div><div class=stat><b>${S.c.lessons.length}</b>${t('lessons')}</div><div class=stat><b>${S.c.quizzes.length}</b>${t('quizzes')}</div></div><h3>${t('users')}</h3><table>${u.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.username)}</small></td><td>${t(x.role)}</td><td>${x.approved?'✅':'⏳'}</td><td>${x.approved?'':`<button onclick="adm('approve',${x.id})">${t('approve')}</button> `}<button onclick="adm('reset',${x.id})">${t('reset')}</button></td></tr>`).join('')}</table><h3>${t('ann')}</h3>${annV()}`}
async function adm(a,id){const b={id};if(a=='reset'){b.password=prompt(t('pw'));if(!b.password)return}await api('/api/admin/'+a,'POST',b);boot()}
function setL(l){S.lang=l;localStorage.lang=l;document.documentElement.lang=l;render()}
function render(){const u=g('un')&&g('un').value,p=g('pw')&&g('pw').value;let b;if(!S.user)b=landV();else if(!S.c)b=`<main><p>${t('load')}</p></main>`;else b='<main>'+{student:studV,teacher:teachV,admin:admV}[S.user.role]()+'</main>';g('app').innerHTML=hdr()+b+'<footer>Developed by Piyush and Team</footer>'+(S.toast?`<div class=toast>${S.toast}</div>`:'');if(u&&g('un'))g('un').value=u;if(p&&g('pw'))g('pw').value=p}
addEventListener('keydown',e=>{if(e.key=='Enter'&&!S.user&&g('un'))doAuth()});
addEventListener('online',()=>{if(S.user&&S.user.role=='student')flush();render()});addEventListener('offline',render);
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
fetch('/api/config').then(r=>r.json()).then(c=>{S.cfg=c;localStorage.cfg=JSON.stringify(c)}).catch(()=>{S.cfg=JSON.parse(localStorage.cfg||'{}')}).finally(()=>S.user?boot():render());
</script></body></html>
