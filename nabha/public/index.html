<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nabha Digital Learning</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Noto+Sans+Gurmukhi&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f7f5;
        --c: #fff;
        --t: #12302a;
        --p: #13a085;
        --p2: #0b6e5b;
        --b: #dce9e4;
        --sh: 0 8px 28px #0b3d3318;
      }
      body.dark {
        --bg: #0b1613;
        --c: #14251f;
        --t: #e8f3ef;
        --b: #27413a;
        --sh: 0 8px 28px #0006;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          17px/1.5 "Noto Sans Gurmukhi",
          "Noto Sans Devanagari",
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--t);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 18px;
        background: linear-gradient(90deg, var(--p2), var(--p));
        color: #fff;
        box-shadow: var(--sh);
        z-index: 5;
      }
      header.land {
        position: absolute;
        left: 0;
        right: 0;
        background: none;
        box-shadow: none;
      }
      .logo {
        font-size: 1.05rem;
      }
      .sp {
        flex: 1;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid var(--b);
        background: var(--c);
        color: var(--t);
        cursor: pointer;
        min-height: 44px;
        transition: 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
      }
      header button {
        background: #ffffff26;
        color: #fff;
        border-color: #ffffff40;
        padding: 6px 12px;
        min-height: 36px;
        backdrop-filter: blur(6px);
      }
      .lg.on {
        background: #fff !important;
        color: var(--p2) !important;
        font-weight: 700;
      }
      .pri {
        background: linear-gradient(135deg, var(--p), var(--p2));
        color: #fff;
        border: 0;
        margin: 8px 8px 8px 0;
        box-shadow: 0 6px 16px #13a08560;
      }
      .dot {
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 20px;
        background: #ffffff26;
      }
      .dot.off {
        color: #ffd27a;
      }
      main {
        flex: 1;
        max-width: 860px;
        width: 100%;
        margin: 0 auto;
        padding: 20px 16px;
      }
      footer {
        text-align: center;
        padding: 16px;
        background: var(--c);
        border-top: 1px solid var(--b);
        font-size: 0.9rem;
      }
      .hero {
        position: relative;
        overflow: hidden;
        min-height: 92vh;
        display: flex;
        align-items: center;
        padding: 90px 20px 50px;
        background: linear-gradient(135deg, #072e27, #0f7a63 50%, #2a55c0);
        color: #fff;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.45;
        animation: fl 9s ease-in-out infinite alternate;
      }
      .b1 {
        width: 340px;
        height: 340px;
        background: #ffb703;
        top: -80px;
        right: -60px;
      }
      .b2 {
        width: 300px;
        height: 300px;
        background: #2de0b5;
        bottom: -90px;
        left: -70px;
        animation-delay: -4s;
      }
      @keyframes fl {
        to {
          transform: translate(30px, 40px) scale(1.15);
        }
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .hero-in {
        position: relative;
        max-width: 1080px;
        margin: auto;
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 40px;
        align-items: center;
        width: 100%;
      }
      .hl {
        animation: up 0.8s both;
      }
      .hero h1 {
        font-size: clamp(2rem, 5vw, 3.3rem);
        line-height: 1.2;
        margin: 14px 0;
      }
      .sub {
        font-size: 1.1rem;
        opacity: 0.92;
        max-width: 520px;
      }
      .pill,
      .chips span {
        display: inline-block;
        padding: 7px 15px;
        border-radius: 30px;
        background: #ffffff26;
        border: 1px solid #ffffff40;
        font-size: 0.92rem;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }
      .glass {
        background: var(--c);
        color: var(--t);
        border-radius: 26px;
        padding: 24px;
        box-shadow: 0 30px 70px #0006;
        animation: up 0.8s 0.15s both;
      }
      .glass h2 {
        margin: 16px 0 4px;
      }
      .feats {
        max-width: 1080px;
        margin: 0 auto;
        padding: 50px 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .fc {
        background: var(--c);
        border: 1px solid var(--b);
        border-radius: 20px;
        padding: 22px;
        box-shadow: var(--sh);
        transition: 0.25s;
      }
      .fc:hover {
        transform: translateY(-6px);
      }
      .fc h3 {
        margin: 8px 0 4px;
      }
      .fc p {
        margin: 0;
        opacity: 0.8;
      }
      .fc i {
        font-style: normal;
        font-size: 2rem;
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: linear-gradient(135deg, #d9f5ec, #fff0c2);
      }
      .banner {
        background: linear-gradient(120deg, var(--p2), var(--p) 55%, #3b6fe0);
        color: #fff;
        border-radius: 22px;
        padding: 20px 24px;
        margin-bottom: 12px;
        box-shadow: var(--sh);
      }
      .banner h2 {
        margin: 0;
      }
      .card,
      .item,
      .stat {
        background: var(--c);
        border: 1px solid var(--b);
        border-radius: 18px;
        padding: 16px;
        margin: 10px 0;
        box-shadow: var(--sh);
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: 0.2s;
      }
      .item:hover {
        transform: translateX(5px);
        border-color: var(--p);
      }
      .ic {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, #d9f5ec, #ffeeba);
        font-size: 1.3rem;
        flex: none;
      }
      .gr {
        flex: 1;
      }
      .ck {
        font-size: 1.3rem;
      }
      .row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
      }
      .stat {
        flex: 1;
        min-width: 110px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 1.8rem;
        background: linear-gradient(135deg, var(--p), #3b6fe0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tabs {
        display: flex;
        gap: 6px;
        background: var(--bg);
        padding: 6px;
        border-radius: 16px;
      }
      .tabs button {
        flex: 1;
        border: 0;
        background: none;
        font-size: 0.95rem;
        padding: 8px 4px;
      }
      .tabs .on {
        background: linear-gradient(135deg, var(--p), var(--p2));
        color: #fff;
        box-shadow: 0 6px 14px #13a08550;
      }
      input,
      select {
        width: 100%;
        padding: 12px 14px;
        margin: 6px 0;
        border-radius: 12px;
        border: 1px solid var(--b);
        background: var(--bg);
        color: var(--t);
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--p);
      }
      .ring {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: conic-gradient(var(--p) calc(var(--v) * 1%), var(--b) 0);
        display: grid;
        place-items: center;
      }
      .ring span {
        background: var(--c);
        width: 90px;
        height: 90px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 1.4rem;
      }
      .hint {
        background: #fff3cd;
        color: #5c4400;
        padding: 12px 16px;
        border-radius: 14px;
        margin: 10px 0;
      }
      .err {
        color: #d64545;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--b);
      }
      .bar {
        background: var(--b);
        height: 10px;
        border-radius: 6px;
        min-width: 70px;
      }
      .bar i {
        display: block;
        height: 10px;
        background: linear-gradient(90deg, var(--p), #3b6fe0);
        border-radius: 6px;
      }
      .opt {
        display: block;
        padding: 11px;
        margin: 6px 0;
        border: 1px solid var(--b);
        border-radius: 12px;
      }
      .opt input {
        width: auto;
      }
      .good {
        background: #c8f0d8;
        color: #123;
      }
      .bad {
        background: #f8c9c4;
        color: #321;
      }
      a {
        color: var(--p);
        cursor: pointer;
        text-decoration: underline;
      }
      .toast {
        position: fixed;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--p2);
        color: #fff;
        padding: 10px 20px;
        border-radius: 24px;
        box-shadow: var(--sh);
      }
      @media (max-width: 820px) {
        .hero-in {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        .hero {
          padding-top: 110px;
        }
      }

            q: typeof item.q == "string" ? { en: item.q, hi: item.q, pa: item.q } : item.q,
            o: item.o.map(opt => typeof opt == "string" ? opt : (opt.en || "")),
            a: item.a || 0
          }));

        <td><span class="pill-subject">${t(normSubj(x.subject))}</span></td>

        <td>${x.approved ? '<span class="badge-status">✔</span>' : '<span style="display:inline-flex;align-items:center;padding:2px 8px;background:#fef3c7;color:#b45309;border-radius:6px;font-size:12px;font-weight:bold">⏳ Pending</span>'}</td>
        <td style="white-space:nowrap">
          ${x.approved ? "" : `<button class="btn-approve" onclick="adm('approve','${x.id}')">${t("approve")}</button> `}
          <button class="btn-action" onclick="admEdit('${x.id}')">✏️ ${t("edit")}</button>
          <button class="btn-action" onclick="adm('reset','${x.id}')">🔑 ${t("reset")}</button>
          <button onclick="admDelete(${x.id},'${esc(x.name)}')" style="color:#d9534f">🗑️ ${t("delete")}</button>
        </td>
      </tr>`;
    })
    .join("")}
</table>` : `<p class=sub>${t("noTeachers")}</p>`}

<h3>🎒 ${t("studentsDir")} (${students.length})</h3>
${students.length ? `<table>
  <tr><th>${t("name")}</th><th>${t("cls")}</th><th>${t("status")}</th><th>${t("actions")}</th></tr>
  ${students
    .map((x) => {
      if (S.editU === x.id) {
        return `<tr style="background:var(--card,#f4f6fa)">
          <td colspan=4 style="padding:10px">
            <div style="font-weight:bold;margin-bottom:6px">✏️ ${t("edit")}: ${esc(x.name)}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
              <input id="eu_name_${x.id}" value="${esc(x.name)}" placeholder="${t("name")}" style="flex:1;min-width:140px">
              <input id="eu_uname_${x.id}" value="${esc(x.username)}" placeholder="${t("username")}" style="flex:1;min-width:140px">
              <input id="eu_cls_${x.id}" type=number min=6 max=12 value="${x.class || 8}" placeholder="${t("cls")}" style="width:90px">
            </div>
            <button class=pri onclick="admSave('${x.id}')">💾 ${t("save")}</button>
            <button onclick="admEdit(null)">❌ ${t("cancel")}</button>
          </td>
        </tr>`;
      }
      return `<tr>
        <td><b>${esc(x.name)}</b><br><small style="color:var(--sub)">${esc(x.username)}</small></td>
        <td>${t("cls")} ${x.class || 8}</td>
        <td>${x.approved ? '<span class="badge-status">✔</span>' : '<span style="display:inline-flex;align-items:center;padding:2px 8px;background:#fef3c7;color:#b45309;border-radius:6px;font-size:12px;font-weight:bold">⏳ Pending</span>'}</td>
        <td style="white-space:nowrap">
          ${x.approved ? "" : `<button class="btn-approve" onclick="adm('approve','${x.id}')">${t("approve")}</button> `}
          <button class="btn-action" onclick="admEdit('${x.id}')">✏️ ${t("edit")}</button>
          <button class="btn-action" onclick="adm('reset','${x.id}')">🔑 ${t("reset")}</button>
          <button onclick="admDelete(${x.id},'${esc(x.name)}')" style="color:#d9534f">🗑️ ${t("delete")}</button>
        </td>
      </tr>`;
    })
    .join("")}
</table>` : `<p class=sub>${t("noStu")}</p>`}

${admins.length ? `<h3>🛡️ ${t("admin")}</h3><table>${admins.map((x) => `<tr><td><b>${esc(x.name)}</b><br><small style="color:var(--sub)">${esc(x.username)}</small></td><td>${t("admin")}</td><td>✅</td><td><button class="btn-action" onclick="adm('reset','${x.id}')">🔑 ${t("reset")}</button></td></tr>`).join("")}</table>` : ""}
`;
        }

        return `<div class=banner><h2>🛠️ ${t("admin")}</h2></div>
<div class=row>
  <div class=stat style="cursor:pointer" onclick="S.admTab='users';render()"><b>${students.length}</b>${t("student")}</div>
  <div class=stat style="cursor:pointer" onclick="S.admTab='users';render()"><b>${teachers.length}</b>${t("teacher")}</div>
  <div class=stat style="cursor:pointer" onclick="S.admTab='users';render()"><b>${u.filter((x) => !x.approved).length}</b>${t("pending")}</div>
  <div class=stat style="cursor:pointer" onclick="S.admTab='lessons';render()"><b>${allLessons.length}</b>${t("lessons")}</div>
  <div class=stat style="cursor:pointer" onclick="S.admTab='quizzes';render()"><b>${allQuizzes.length}</b>${t("quizzes")}</div>
</div>

<div style="display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap;border-bottom:2px solid var(--border,#e2e8f0);padding-bottom:10px">
  <button style="border-radius:20px;padding:6px 16px;font-weight:600;${curTab === 'users' ? 'background:#0d9488;color:#fff;border:1px solid #0d9488;box-shadow:0 4px 14px rgba(13,148,136,0.25)' : 'background:#fff;color:#334155;border:1px solid #e2e8f0'}" onclick="S.admTab='users';render()">👥 ${t("users")}</button>
  <button style="border-radius:20px;padding:6px 16px;font-weight:600;${curTab === 'lessons' ? 'background:#0d9488;color:#fff;border:1px solid #0d9488;box-shadow:0 4px 14px rgba(13,148,136,0.25)' : 'background:#fff;color:#334155;border:1px solid #e2e8f0'}" onclick="S.admTab='lessons';render()">📚 ${t("lessons")}</button>
  <button style="border-radius:20px;padding:6px 16px;font-weight:600;${curTab === 'quizzes' ? 'background:#0d9488;color:#fff;border:1px solid #0d9488;box-shadow:0 4px 14px rgba(13,148,136,0.25)' : 'background:#fff;color:#334155;border:1px solid #e2e8f0'}" onclick="S.admTab='quizzes';render()">📝 ${t("quizzes")}</button>
  <button style="border-radius:20px;padding:6px 16px;font-weight:600;${curTab === 'ann' ? 'background:#0d9488;color:#fff;border:1px solid #0d9488;box-shadow:0 4px 14px rgba(13,148,136,0.25)' : 'background:#fff;color:#334155;border:1px solid #e2e8f0'}" onclick="S.admTab='ann';render()">📢 ${t("ann")}</button>
</div>

${contentHtml}`;
      }
      async function adm(a, id) {
        const b = { id };
        if (a === "reset") {
          b.password = prompt(t("pw") || "Enter new password:");
          if (!b.password) return;
        }
        const endpoint = a === "reset" ? "/api/admin/reset" : "/api/admin/approve";
        const res = await api(endpoint, "POST", b);
        if (res && res.error) {
          alert(t(res.error) || res.error);
        } else {
          boot();
        }
      }
      function admEdit(id) {
        S.editU = S.editU === id ? null : id;
        render();
      }
      async function admSave(id) {
        const u = (S.users || []).find((x) => String(x.id) === String(id));
        if (!u) return;
        const nameEl = g("eu_name_" + id);
        const unameEl = g("eu_uname_" + id);
        if (!nameEl || !unameEl) return;
        const name = nameEl.value.trim();
        const username = unameEl.value.trim();
        if (!name || !username) {
          alert("Please provide both name and username");
          return;
        }
        const b = { id, name, username };
        if (u.role === "teacher") {
          const sEl = g("eu_subj_" + id);
          if (sEl) b.subject = sEl.value;
          const cEl = g("eu_cls_teach_" + id);
          if (cEl) b.class = +cEl.value || 8;
        } else if (u.role === "student") {
          const cEl = g("eu_cls_" + id);
          if (cEl) b.class = +cEl.value || 8;
        }
        try {
          const res = await api("/api/admin/update-user", "POST", b);
          if (res && res.error) {
            alert(t(res.error) || res.error || "Update failed");
            return;
          }
          S.editU = null;
          boot();
        } catch (e) {
          alert("Failed to update user");
        }
      }
      async function admDelete(id, name) {
        name = name || 'this user';
        if (!confirm((t("confirmDelete") || "Are you sure you want to delete this user?") + "\n\n" + name)) return;
        try {
          const res = await api("/api/admin/delete-user", "POST", { id });
          if (res && res.error) {
            alert(t(res.error) || res.error || "Delete failed");
          } else {
            boot();
          }
        } catch (e) {
          alert("Delete failed: " + (e.message || e));
        }
      }
      function setL(l) {
        S.lang = l;
        localStorage.lang = l;
        document.documentElement.lang = l;
        render();
      }
      function footerV() {
        if (S.user) {
          return `<footer>👤 <b>${esc(S.user.name)}</b> (${t(S.user.role)}) · Developed by Piyush and Team</footer>`;
        }
        return "<footer>Developed by Piyush and Team</footer>";
      }
      function render() {
        const u = g("un") && g("un").value,
          p = g("pw") && g("pw").value,
          nm = g("nm") && g("nm").value,
          cl = g("cl") && g("cl").value,
          tc = g("cl_teach") && g("cl_teach").value,
          sr = g("sub_reg") && g("sub_reg").value;
        if (sr) S.regSub = sr;
        if (tc) S.regTeachCls = +tc;
        let b;
        if (!S.user) b = landV();
        else if (!S.c) b = `<main><p>${t("load")}</p></main>`;
        else
          b =
            "<main>" +
            { student: studV, teacher: teachV, admin: admV }[S.user.role]() +
            "</main>";
        g("app").innerHTML =
          hdr() +
          b +
          footerV() +
          (S.toast ? `<div class=toast>${S.toast}</div>` : "");
        if (u && g("un")) g("un").value = u;
        if (p && g("pw")) g("pw").value = p;
        if (nm && g("nm")) g("nm").value = nm;
        if (cl && g("cl")) g("cl").value = cl;
        if (S.regTeachCls && g("cl_teach")) g("cl_teach").value = S.regTeachCls;
        if (S.regSub && g("sub_reg")) g("sub_reg").value = S.regSub;
      }
      addEventListener("keydown", (e) => {
        if (e.key == "Enter" && !S.user && g("un")) doAuth();
      });
      addEventListener("online", () => {
        if (S.user && S.user.role == "student") flush();
        render();
      });
      addEventListener("offline", render);
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("/sw.js");
      fetch("/api/config")
        .then((r) => r.json())
        .then((c) => {
          S.cfg = c;
          localStorage.cfg = JSON.stringify(c);
        })
        .catch(() => {
          S.cfg = JSON.parse(localStorage.cfg || "{}");
        })
        .finally(() => (S.user ? boot() : render()));
    </script>
  </body>
</html>
